<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR · Agentic AI FSI</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b1a30;color:#fff;font-family:Inter,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;box-sizing:border-box;text-align:center}
  .wm{font-weight:800;font-size:20px;letter-spacing:-.02em}.wm span{color:#5b8cff}
  h1{margin:0;font-size:clamp(30px,6vw,54px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;background:linear-gradient(90deg,#7aa2ff,#9ef0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card{background:#fff;border-radius:22px;padding:18px}
  .card img{display:block;width:min(70vmin,460px);height:auto}
  p{margin:0;color:#c9d3e6;font-size:clamp(16px,2.4vw,22px)}
  .roles{font-weight:500;color:#fff}
</style>
</head>
<body>
<main>
  <div class="wm">BearingPoint<span>.</span> Financial Services</div>
  <h1>Agentic AI · <em>on recrute</em></h1>
  <div class="card"><img src="assets/qr.svg" alt="QR code vers les offres"></div>
  <p class="roles">Stage de fin d'études · Consultant·e · Senior Consultant·e</p>
  <p>Scannez, choisissez une offre, postulez en 1 minute.</p>
</main>
</body>
</html>
