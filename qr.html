<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Agentic AI FSI</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
  main{position:relative;overflow:hidden;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;box-sizing:border-box;text-align:center}
  .logo{height:30px;width:auto}
  .team{font-size:15px;font-weight:600;color:#e6deda;margin-top:-12px}
  h1{margin:0;font-size:clamp(30px,6vw,54px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;color:#ff3d47}
  .card{background:#fff;border-radius:18px;padding:18px;border-bottom:6px solid #ff3d47}
  .card img{display:block;width:min(64vmin,440px);height:auto}
  p{margin:0;color:#e6deda;font-size:clamp(16px,2.4vw,22px)}
  .roles{font-weight:600;color:#fff}
  .mark{position:absolute;right:-80px;bottom:-60px;width:380px;opacity:.07;pointer-events:none}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-wordmark-white.svg" alt="BearingPoint">
  <div class="team">Financial Services Industry</div>
  <h1>Agentic AI : <em>on recrute</em></h1>
  <div class="card"><img src="assets/qr.svg" alt="QR code vers les offres"></div>
  <p class="roles">Stage de fin d'études, Consultant junior, Senior Consultant</p>
  <p>Scannez, choisissez une offre, postulez en une minute.</p>
  <img class="mark" src="assets/logo-symbol-white.svg" alt="" aria-hidden="true">
</main>
</body>
</html>
