<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>QR téléphone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:390px;height:844px;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  main{position:relative;height:844px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 24px;box-sizing:border-box;text-align:center}
  .logo{height:24px;width:auto}
  .team{font-size:13px;font-weight:600;color:#e6deda;margin-top:-8px;letter-spacing:.02em}
  h1{margin:14px 0 4px;font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;color:#ff3d47}
  .card{background:#fff;border-radius:18px;padding:14px;border-bottom:6px solid #ff3d47}
  .card img{display:block;width:300px;height:300px}
  .roles{margin:6px 0 0;font-weight:600;font-size:15px;line-height:1.5}
  .cta{margin:0;color:#e6deda;font-size:14px}
  .url{margin:4px 0 0;color:#b2a59f;font-size:11.5px;word-break:break-all}
  .mark{position:absolute;right:-70px;bottom:-40px;width:300px;opacity:.07}
</style>
</head>
<body>
<main>
  <img class="logo" src="../assets/logo-wordmark-white.svg" alt="BearingPoint">
  <div class="team">Financial Services Industry</div>
  <h1>Agentic AI<br><em>on recrute</em></h1>
  <div class="card"><img src="../assets/qr.svg" alt="QR code"></div>
  <p class="roles">Stage de fin d'études<br>Consultant junior<br>Senior Consultant</p>
  <p class="cta">Scannez, choisissez une offre, postulez en une minute.</p>
  <p class="url" id="url"></p>
  <img class="mark" src="../assets/logo-symbol-white.svg" alt="">
</main>
<script>document.getElementById('url').textContent=new URLSearchParams(location.search).get('u')||'';</script>
</body>
</html>
